name: Go Lint

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go version for linting'
        required: false
        type: string
        default: '1.26.x'
      golangci-lint-version:
        description: 'golangci-lint version'
        required: false
        type: string
        default: 'latest'
      modules:
        description: 'JSON array of module directories containing go.mod'
        required: false
        type: string
        default: '["."]'
      timeout:
        description: 'Lint timeout'
        required: false
        type: string
        default: '8m'
      args:
        description: 'Additional golangci-lint arguments'
        required: false
        type: string
        default: '--verbose'
      runs-on:
        description: 'Runner label to lint on'
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(inputs.modules) }}
    runs-on: ${{ inputs.runs-on }}
    name: lint (${{ matrix.module }})
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Checkout shared lint config
      uses: actions/checkout@v6
      with:
        repository: plexusone/.github
        path: .golangci-shared
        sparse-checkout: |
          .golangci.yaml
        sparse-checkout-cone-mode: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        check-latest: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: ${{ inputs.golangci-lint-version }}
        args: --config=${{ github.workspace }}/.golangci-shared/.golangci.yaml --timeout ${{ inputs.timeout }} ${{ inputs.args }}
        working-directory: ${{ matrix.module }}
