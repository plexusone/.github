name: Go CI

on:
  workflow_call:
    inputs:
      go-versions:
        description: 'JSON array of Go versions to test'
        required: false
        type: string
        default: '["1.26.x"]'
      platforms:
        description: 'JSON array of platforms to test on'
        required: false
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      modules:
        description: 'JSON array of module directories containing go.mod'
        required: false
        type: string
        default: '["."]'
      test-flags:
        description: 'Additional flags for go test'
        required: false
        type: string
        default: '-v -covermode=count'
      race:
        description: 'Run the tests with the race detector in a separate job'
        required: false
        type: boolean
        default: true
      race-platform:
        description: 'Platform for the race detector job'
        required: false
        type: string
        default: 'ubuntu-latest'
      race-flags:
        description: 'Additional flags for go test in the race detector job, such as -short or -tags; -race -covermode=atomic are always set'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJson(inputs.go-versions) }}
        platform: ${{ fromJson(inputs.platforms) }}
        module: ${{ fromJson(inputs.modules) }}
    runs-on: ${{ matrix.platform }}
    name: test (${{ matrix.module }}, ${{ matrix.go-version }}, ${{ matrix.platform }})
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: Run tests
      working-directory: ${{ matrix.module }}
      run: go test ${{ inputs.test-flags }} ./...

  race:
    if: ${{ inputs.race }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJson(inputs.go-versions) }}
        module: ${{ fromJson(inputs.modules) }}
    runs-on: ${{ inputs.race-platform }}
    name: race (${{ matrix.module }}, ${{ matrix.go-version }}, ${{ inputs.race-platform }})
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    # The race detector needs cgo, and -covermode must be atomic with -race.
    - name: Run tests with the race detector
      working-directory: ${{ matrix.module }}
      shell: bash
      env:
        CGO_ENABLED: '1'
        RACE_FLAGS: ${{ inputs.race-flags }}
      # RACE_FLAGS is unquoted on purpose so it splits into separate flags.
      run: go test -race -covermode=atomic $RACE_FLAGS ./...
